spring:
  application:
    name: perudo-backend
  webflux:
    cors:
      allowed-origins: http://localhost:3000
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"
  web:
    resources:
      static-locations: classpath:/public/

server:
  port: 8080

logging:
  level:
    root: INFO
    com.perudo: DEBUG
