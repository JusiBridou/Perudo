spring:
  application:
    name: perudo-backend
  mvc:
    static-path-pattern: /static/**
  web:
    resources:
      static-locations: classpath:/public/
  webflux:
    cors:
      allowed-origins: http://localhost:3000,http://localhost:8080
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"

server:
  port: 8080

logging:
  level:
    root: INFO
    com.perudo: DEBUG
