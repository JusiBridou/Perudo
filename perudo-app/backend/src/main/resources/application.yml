spring:
  application:
    name: perudo-backend
  webflux:
    cors:
      allowed-origins: http://localhost:3000
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.perudo: DEBUG
